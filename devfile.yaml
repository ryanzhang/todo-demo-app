schemaVersion: 2.2.0
metadata:
  name: todo-demo-app-dev-environment
  version: 1.2.1
  provider: Red Hat
  supportUrl: https://github.com/devfile-samples/devfile-support#support-information
  icon: https://design.jboss.org/quarkus/logo/final/SVG/quarkus_icon_rgb_default.svg
  website: https://quarkus.io
  displayName: Quarkus Java
  description: Quarkus with Java
  tags:
    - Java
    - Quarkus
  projectType: Quarkus
  language: Java
  attributes:
    alpha.dockerimage-port: 8081
    
projects:
  - name: todo-demo-app
    git:
      remotes:
        origin: 'https://github.com/ryanzhang/todo-demo-app.git'
      checkoutFrom:
        revision: master
# parent:
#   id: java-quarkus
#   registryUrl: 'https://registry.devfile.io'
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel8:3.5
      memoryLimit: 2048Mi
      cpuLimit: 1000m
      mountSources: true
      endpoints:
        - name: http-3000
          targetPort: 3000
      volumeMounts:
        - name: m2
          path: /home/user/.m2
  - name: m2
    volume:
      size: 3G   
  - name: image-build
    image:
      imageName: java-quarkus-image:latest
      dockerfile:
        uri: src/main/docker/Dockerfile.jvm.staged
        buildContext: .
        rootRequired: false
commands:
  - id: build-image
    apply:
      component: image-build
  - id: deployk8s
    apply:
      component: kubernetes-deploy
  - id: deploy
    composite:
      commands:
        - build-image
        - deployk8s
      group:
        kind: deploy
        isDefault: true 
  - id: dev
    exec:
      label: "Quarkus hot run"
      component: tools
      workingDir: /projects/todo-demo-app
      commandLine: "mvn quarkus:dev"
      group:
        kind: run

